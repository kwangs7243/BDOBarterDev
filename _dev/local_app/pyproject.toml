[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo-barter-local-app"
version = "0.1.0"
description = "SPEC-001 localhost and persistent storage foundation for BDO Barter"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "waitress>=3.0,<4",
  "numpy>=1.24,<3",
  "Pillow>=10",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.10,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

