[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo-barter-local-app"
version = "0.1.0"
description = "Local BDO Barter application with review-first trade recognition"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "waitress>=3.0,<4",
  "numpy>=1.24,<3",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
package = ["pyinstaller>=6.10,<7", "onnxruntime>=1.30,<2", "opencv-python-headless==4.10.0.84", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

